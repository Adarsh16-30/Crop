# Non-secret MQTT settings. Any key can be overridden with MQTT_<KEY>.
# Credentials come from the environment / .env: MQTT_USERNAME, MQTT_PASSWORD.
[mqtt]
host = localhost
port = 8883
topic = crop/spectral
client_id = crop-disease-system
keepalive = 60
qos = 1
# CA that signed the broker certificate (scripts/gen_mqtt_certs.sh). The
# broker only accepts TLS; set this empty only for a broker you run without TLS.
tls_ca_file = certs/mqtt/ca.crt
