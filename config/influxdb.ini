# Non-secret InfluxDB settings. Tokens come from the environment / .env:
#   INFLUX_TOKEN        admin token (setup script only)
#   INFLUX_WRITE_TOKEN  write-only token used by the MQTT bridge
#   INFLUX_READ_TOKEN   read-only token used by Grafana
[influxdb]
url = http://localhost:8086
org = crop-org
bucket = crop_data
