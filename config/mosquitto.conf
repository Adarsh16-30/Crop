# Mosquitto MQTT Broker Configuration (used by docker-compose.yml)

# TLS-only: there is no plaintext listener, so credentials and sensor data
# are always encrypted in transit. Certificates come from
# scripts/gen_mqtt_certs.sh and are copied into the data volume at startup.
listener 8883
protocol mqtt
cafile /mosquitto/data/certs/ca.crt
certfile /mosquitto/data/certs/server.crt
keyfile /mosquitto/data/certs/server.key
tls_version tlsv1.2
require_certificate false

# Authentication is required. The password file is generated at container
# start from MQTT_USERNAME / MQTT_PASSWORD (see docker-compose.yml).
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/data/acl

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

persistence true
persistence_location /mosquitto/data/
