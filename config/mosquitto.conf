# Mosquitto MQTT Broker Configuration
# Used by docker-compose.yml

# Default listener on port 1883
listener 1883
protocol mqtt

# WebSocket listener on port 9001 (optional, for browser clients)
listener 9001
protocol websockets

# Allow anonymous connections (development only)
allow_anonymous true

# Logging
log_dest stdout
log_type all
connection_messages true

# Persistence
persistence true
persistence_location /mosquitto/data/
