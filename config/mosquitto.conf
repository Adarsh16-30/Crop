# Mosquitto MQTT Broker Configuration (used by docker-compose.yml)

listener 1883
protocol mqtt

# Authentication is required. The password file is generated at container
# start from MQTT_USERNAME / MQTT_PASSWORD (see docker-compose.yml).
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/data/acl

# For TLS, add a listener on 8883 with cafile/certfile/keyfile and point
# clients at it via MQTT_TLS_CA_FILE.

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

persistence true
persistence_location /mosquitto/data/
