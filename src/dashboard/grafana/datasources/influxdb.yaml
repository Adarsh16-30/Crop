apiVersion: 1

datasources:
  - name: InfluxDB
    uid: influxdb-crop
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: ${INFLUX_ORG}
      defaultBucket: ${INFLUX_BUCKET}
    secureJsonData:
      # Read-only token (python -m src.dashboard.influxdb_setup --create-tokens)
      token: ${INFLUX_READ_TOKEN}
    isDefault: true
    editable: false
