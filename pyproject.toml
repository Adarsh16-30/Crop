[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crop-disease-detection"
version = "2.0.0"
description = "Pre-symptomatic crop disease detection from multispectral time series (synthetic-data research prototype)"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "slow: end-to-end tests that train small models (deselect with -m 'not slow')",
]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "demo_pipeline.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B008: FastAPI Depends() defaults are idiomatic. B905: zip(strict=) not required.
ignore = ["E402", "B008", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
