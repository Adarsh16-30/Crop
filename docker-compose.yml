# Secrets come from .env (copy .env.example). Ports are bound to 127.0.0.1
# so the stack is not reachable from other machines by default.
#
#   docker compose up -d                      # infrastructure only
#   docker compose --profile app up -d        # + API, bridge, simulator

x-app: &app
  build: .
  image: crop-disease-app:latest
  env_file: .env
  environment:
    MQTT_HOST: mosquitto
    MQTT_PORT: "8883"
    MQTT_TLS_CA_FILE: /app/certs/ca.crt
    INFLUX_URL: http://influxdb:8086
  volumes:
    - ./models/checkpoints:/app/models/checkpoints:ro
    - ./certs/mqtt/ca.crt:/app/certs/ca.crt:ro
  restart: unless-stopped
  profiles: ["app"]

services:
  influxdb:
    image: influxdb:2.7.11
    container_name: crop-influxdb
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_ADMIN_USER:?set in .env}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD:?set in .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-crop-org}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-crop_data}
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?set in .env}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana-oss:10.4.0
    container_name: crop-grafana
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      INFLUX_ORG: ${INFLUX_ORG:-crop-org}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-crop_data}
      # Prefer the read-only token; falls back to the admin token until
      # `python -m src.dashboard.influxdb_setup --create-tokens` has been run.
      INFLUX_READ_TOKEN: ${INFLUX_READ_TOKEN:-${INFLUX_TOKEN}}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./src/dashboard/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./src/dashboard/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./src/dashboard/grafana/alerting:/etc/grafana/provisioning/alerting:ro
    depends_on:
      influxdb:
        condition: service_healthy
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: crop-mosquitto
    ports:
      - "127.0.0.1:8883:8883"
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:?set in .env}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set in .env}
    # Before starting: build the hashed password file from the env
    # credentials, and copy the ACL and TLS material into the data volume,
    # owned by the mosquitto user with 0700 (the broker drops root before
    # reading them, and bind mounts from Windows are world-readable).
    command: >
      sh -c '[ -f /mosquitto/certs.src/server.crt ] && [ -f /mosquitto/certs.src/server.key ]
      || { echo "Missing MQTT TLS certificates: run scripts/gen_mqtt_certs.sh" >&2; exit 1; }
      && mosquitto_passwd -c -b /mosquitto/data/passwd "$$MQTT_USERNAME" "$$MQTT_PASSWORD"
      && cp /mosquitto/config/acl.src /mosquitto/data/acl
      && mkdir -p /mosquitto/data/certs
      && cp /mosquitto/certs.src/ca.crt /mosquitto/certs.src/server.crt /mosquitto/certs.src/server.key /mosquitto/data/certs/
      && chown -R mosquitto:mosquitto /mosquitto/data/passwd /mosquitto/data/acl /mosquitto/data/certs
      && chmod 0700 /mosquitto/data/passwd /mosquitto/data/acl /mosquitto/data/certs
      && chmod 0600 /mosquitto/data/certs/server.key
      && exec mosquitto -c /mosquitto/config/mosquitto.conf'
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./config/mosquitto.acl:/mosquitto/config/acl.src:ro
      - ./certs/mqtt:/mosquitto/certs.src:ro
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped

  api:
    <<: *app
    container_name: crop-api
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  bridge:
    <<: *app
    container_name: crop-bridge
    command: ["python", "-m", "src.dashboard.mqtt_subscriber",
              "--model-path", "models/checkpoints/cnn_lstm_attention_best.pt"]
    depends_on: [mosquitto, influxdb]

  simulator:
    <<: *app
    container_name: crop-simulator
    command: ["python", "-m", "src.data.mqtt_publisher"]
    volumes:
      # real sequences to replay, and the split so only held-out sites are streamed
      - ./data/real/cdm_s2:/app/data/real/cdm_s2:ro
      - ./data/processed/sample_meta.csv:/app/data/processed/sample_meta.csv:ro
      - ./certs/mqtt/ca.crt:/app/certs/ca.crt:ro
    depends_on: [mosquitto]

volumes:
  influxdb_data:
  influxdb_config:
  grafana_data:
  mosquitto_data:
